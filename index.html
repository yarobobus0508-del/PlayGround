<!doctype html>
<html lang="ru">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌱%3C/text%3E%3C/svg%3E">
<title>Сад против зомби</title>
<style>
:root{--ink:#172a20;--deep:#173b2b;--green:#3e7747;--lime:#c8df75;--cream:#fff5da;--gold:#ffcf56;--pink:#ed7d6a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173b2b;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.app{height:100dvh;min-height:450px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#406b43,#183b2c 80%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}.topbar{height:64px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 clamp(12px,3vw,34px);color:#fff4d8}.brand{display:flex;align-items:center;gap:10px;min-width:180px}.brand-mark{width:39px;height:39px;border-radius:13px;background:#d3e782;display:grid;place-items:center;box-shadow:inset 0 -4px #a4c058;font-size:23px}.brand-name{font-weight:1000;font-size:15px;letter-spacing:.04em;line-height:1}.brand-sub{font-size:10px;opacity:.7;margin-top:4px;letter-spacing:.12em;text-transform:uppercase}.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.pill{border:1px solid #ffffff36;background:#ffffff13;color:#fff4d8;border-radius:13px;height:38px;padding:0 12px;font-weight:800;display:flex;align-items:center;gap:7px}.pill:hover{background:#ffffff24}.icon-btn{width:39px;justify-content:center;padding:0;font-size:18px}.game-shell{position:relative;flex:1;min-height:0;max-width:1480px;width:100%;margin:auto;display:flex;flex-direction:column;padding:0 clamp(10px,2.4vw,30px) 12px;gap:8px}.hud{min-height:68px;display:flex;align-items:center;gap:12px;flex-shrink:0}.sun-meter{height:54px;min-width:124px;padding:6px 12px;display:flex;align-items:center;gap:9px;border-radius:16px;background:#f9edc9;box-shadow:0 4px 0 #c6ae6e;position:relative;z-index:2}.sun-icon{font-size:27px;filter:drop-shadow(0 2px 0 #d9a83b)}.sun-value{font-size:21px;font-weight:1000;line-height:1}.sun-label{font-size:9px;color:#87784d;font-weight:900;letter-spacing:.13em;margin-top:3px}.seed-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 2px 8px;align-items:center}.seed-row::-webkit-scrollbar{display:none}.seed{width:79px;height:57px;flex:0 0 79px;border:2px solid #756b44;border-radius:12px;background:#e6d9aa;box-shadow:0 3px #a4996d;position:relative;display:flex;align-items:center;gap:4px;padding:5px 5px 8px;transition:transform .12s,border .12s,filter .12s;overflow:hidden}.seed:hover{transform:translateY(-2px)}.seed.selected{border:3px solid #fff3a0;background:#f6eecc;box-shadow:0 0 0 3px #64a850,0 4px #39603a;transform:translateY(-3px)}.seed.disabled{filter:grayscale(.7);opacity:.63}.seed .plant-emoji{font-size:26px;line-height:1}.seed .seed-name{font-size:9px;line-height:1.04;font-weight:900;text-align:left}.seed .cost{position:absolute;right:4px;bottom:1px;font-size:9px;color:#816a31;font-weight:1000}.seed .cool{position:absolute;inset:auto 0 0;height:0;background:#3e474988;pointer-events:none}.hud-right{display:flex;align-items:center;gap:8px;flex-shrink:0}.wave-tag{color:#f5e8bd;font-size:11px;font-weight:900;white-space:nowrap}.wave-tag b{color:#ffdc76;font-size:13px}.control-btn{height:40px;border:0;border-radius:12px;background:#d2e47e;color:#28432b;padding:0 13px;font-weight:1000;box-shadow:0 4px #91ae55;white-space:nowrap}.control-btn:active{transform:translateY(2px);box-shadow:0 2px #91ae55}.control-btn.secondary{background:#f2d89a;box-shadow:0 4px #b49b62;padding:0 10px}.board-frame{position:relative;flex:1;min-height:200px;border-radius:22px;border:7px solid #7d613d;background:#6c4a2d;box-shadow:0 8px 0 #3c3825,0 16px 35px #0e291b88;overflow:hidden}.board-frame:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff17,transparent 25%,#152e1c20);pointer-events:none;z-index:1}.board{display:block;width:100%;height:100%;touch-action:none}.board-overlay{position:absolute;inset:0;display:grid;place-items:center;background:#12271ca8;z-index:3;backdrop-filter:blur(4px);padding:16px}.modal{width:min(440px,100%);border:4px solid #725738;border-radius:24px;padding:22px;background:#fbf0d1;box-shadow:0 8px 0 #413b2b;text-align:center}.modal .eyebrow{font-size:10px;color:#728b4c;font-weight:1000;letter-spacing:.17em;text-transform:uppercase}.modal h1{font-size:clamp(24px,5vw,36px);line-height:1;margin:9px 0;color:#254630}.modal p{font-size:13px;line-height:1.45;color:#5a6047;margin:8px auto 16px;max-width:360px}.modal .hero{font-size:46px;line-height:1}.modal-btn{border:0;border-radius:14px;background:#6ca34b;color:#fff8df;font-weight:1000;padding:13px 20px;box-shadow:0 4px #477238;font-size:15px}.modal-btn:active{transform:translateY(2px);box-shadow:0 2px #477238}.mode-grid{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.mode-choice{background:#eee3c3;border:2px solid #c0ae7d;border-radius:12px;padding:8px 10px;font-size:11px;font-weight:900}.mode-choice.active{background:#d6e8a0;border-color:#76a652}.status-line{height:23px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;color:#f3e7c7;font-weight:800;font-size:11px;padding:0 4px}.hint{opacity:.76}.toast{position:absolute;z-index:4;left:50%;top:12px;transform:translate(-50%,-20px);background:#fff1cf;border:2px solid #c7a969;border-radius:14px;padding:8px 13px;font-size:12px;font-weight:1000;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.wave-flash{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff3d4;text-align:center;font-size:24px;font-weight:1000;text-shadow:0 3px #25442e;pointer-events:none;opacity:0;transition:opacity .25s}.wave-flash.show{opacity:1}.rotate-note{display:none}
@media(max-width:700px){.game-shell{justify-content:flex-start}.board-frame{flex:0 0 auto;height:min(58vh,calc((100vw - 14px)*.5556));min-height:0}.topbar{height:53px;padding:0 12px;gap:8px}.brand{min-width:0}.brand-mark{width:34px;height:34px;border-radius:11px;font-size:20px}.brand-name{font-size:13px}.brand-sub{font-size:8px}.top-actions{gap:5px}.pill{height:34px;padding:0 9px;font-size:11px}.icon-btn{width:34px;padding:0}.game-shell{padding:0 7px 8px;gap:5px}.hud{min-height:94px;align-items:stretch;gap:7px;flex-wrap:wrap;position:relative;padding-left:0}.sun-meter{min-width:92px;width:92px;height:43px;padding:4px 8px;gap:5px;border-radius:12px;align-self:flex-start}.sun-icon{font-size:22px}.sun-value{font-size:18px}.sun-label{font-size:8px}.seed-row{position:absolute;left:0;right:0;bottom:0;height:48px;gap:6px;padding:2px 2px 5px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}.seed-row::-webkit-scrollbar{display:none}.seed{width:70px;height:42px;flex-basis:70px;border-radius:10px;padding:3px 4px 6px}.seed .plant-emoji{font-size:20px}.seed .seed-name{font-size:8px}.seed .cost{font-size:8px}.hud-right{margin-left:auto;align-self:flex-start;gap:5px}.wave-tag{font-size:9px}.wave-tag b{font-size:11px}.control-btn{height:34px;padding:0 9px;font-size:11px;border-radius:10px}.control-btn.secondary{padding:0 8px}.board-frame{border-width:5px;border-radius:15px;box-shadow:0 5px 0 #3c3825,0 10px 24px #0e291b88}.status-line{height:20px;font-size:9px}.modal{padding:18px 15px;border-radius:20px}.modal p{font-size:12px}.mode-choice{font-size:10px}}
@media(max-width:390px){.wave-tag{display:none}.hud-right{gap:4px}.control-btn{padding:0 8px}.seed{width:65px;flex-basis:65px}.seed-row{gap:5px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">🌱</div><div><div class="brand-name">САД ПРОТИВ ЗОМБИ</div><div class="brand-sub">соседский дозор</div></div></div><div class="top-actions"><button class="pill" id="soundBtn" aria-label="Звук">🔊 <span>Звук</span></button><button class="pill icon-btn" id="helpBtn" aria-label="Правила">?</button></div></header>
<main class="game-shell">
<section class="hud"><div class="sun-meter"><span class="sun-icon">☀️</span><div><div class="sun-value" id="sunCount">150</div><div class="sun-label">СОЛНЕЧКИ</div></div></div><div class="seed-row" id="seedRow"></div><div class="hud-right"><div class="wave-tag">ВОЛНА <b id="waveLabel">1 / 3</b></div><button class="control-btn secondary" id="shovelBtn">🪏</button><button class="control-btn" id="pauseBtn">Ⅱ</button></div></section>
<section class="board-frame" id="boardFrame"><canvas class="board" id="board"></canvas><div class="toast" id="toast"></div><div class="wave-flash" id="waveFlash">ВОЛНА НАЧИНАЕТСЯ!<br>🧟</div><div class="board-overlay" id="overlay"></div></section>
<div class="status-line"><span id="statusText">Расставь растения — не пропусти их!</span><span class="hint" id="hintText">☀️ нажми, чтобы собрать</span></div>
</main></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),frame=document.getElementById('boardFrame');
const ui={sun:document.getElementById('sunCount'),row:document.getElementById('seedRow'),wave:document.getElementById('waveLabel'),overlay:document.getElementById('overlay'),toast:document.getElementById('toast'),status:document.getElementById('statusText'),hint:document.getElementById('hintText'),flash:document.getElementById('waveFlash')};
const COLS=9,ROWS=5;
const plants=[
{id:'sun',name:'Подсолнух',emoji:'🌻',cost:50,hp:100,interval:7},
{id:'pea',name:'Горохострел',emoji:'🌱',cost:100,hp:110,interval:1.5},
{id:'wall',name:'Орех',emoji:'🥔',cost:50,hp:650,interval:0},
{id:'cherry',name:'Вишня-бомба',emoji:'🍒',cost:150,hp:1,interval:0},
{id:'snow',name:'Снежный горох',emoji:'🫛',cost:175,hp:110,interval:1.7},
{id:'chomp',name:'Кус-кактус',emoji:'🌵',cost:125,hp:180,interval:0},
{id:'mine',name:'Картошка',emoji:'🥔',cost:25,hp:90,interval:0},
{id:'double',name:'Двойной горох',emoji:'🌿',cost:200,hp:120,interval:1.1}
];
const zombieTypes=[{id:'walk',name:'Гуляка',hp:115,speed:13,emoji:'🧟',reward:25},{id:'cone',name:'Конусоголовый',hp:235,speed:10,emoji:'🧟‍♂️',hat:'🔶',reward:35},{id:'bucket',name:'Ведроголовый',hp:390,speed:8,emoji:'🧟',hat:'🪣',reward:45},{id:'flag',name:'Зомби-знаменосец',hp:150,speed:15,emoji:'🧟‍♂️',hat:'🚩',reward:35},{id:'newspaper',name:'Газетчик',hp:175,speed:19,emoji:'🧟',hat:'📰',reward:40}];
let W=0,H=0,dpr=1,cellW=0,cellH=0,selected=null,shovel=false,paused=false,mode='garden',sun=150,wave=1,score=0,plantsOn=[],zombies=[],shots=[],suns=[],particles=[],lawnMowers=[],rollingNuts=[],last=0,spawnTimer=0,spawned=0,totalZombies=6,gameState='menu',toastTimer=0,sound=true,helpReturn='menu',skyTimer=5;
function resize(){const r=frame.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cellW=W/COLS;cellH=H/ROWS;}
new ResizeObserver(resize).observe(frame);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function boardX(c){return (c+.5)*cellW}function boardY(r){return (r+.5)*cellH}
function showToast(t){ui.toast.textContent=t;ui.toast.classList.add('show');toastTimer=2.1}
function updateHud(){ui.sun.textContent=sun;ui.wave.textContent=mode==='endless'?`${wave} / ∞`:`${Math.min(wave,3)} / 3`;document.querySelectorAll('.seed').forEach(el=>{let p=plants.find(x=>x.id===el.dataset.id);el.classList.toggle('disabled',sun<p.cost);el.classList.toggle('selected',selected===p.id)})}
function buildSeeds(){ui.row.innerHTML='';plants.forEach(p=>{const b=document.createElement('button');b.className='seed';b.dataset.id=p.id;b.innerHTML=`<span class="plant-emoji">${p.emoji}</span><span class="seed-name">${p.name}</span><span class="cost">☀ ${p.cost}</span>`;b.onclick=()=>{if(gameState!=='playing'){showToast('Сначала начни игру!');return}if(sun<p.cost){showToast('Нужно больше солнышек ☀️');return}selected=selected===p.id?null:p.id;shovel=false;updateHud()};ui.row.appendChild(b)});updateHud()}
buildSeeds();
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function drawBoard(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#83ba62');sky.addColorStop(1,'#73a94e');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// grassy tiles and subtle top-down garden texture
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=c*cellW,y=r*cellH;ctx.fillStyle=(r+c)%2?'#80b858':'#8bc266';ctx.fillRect(x,y,cellW,cellH);ctx.fillStyle='#ffffff0b';ctx.fillRect(x,y,cellW,2);ctx.strokeStyle='#4b883e44';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,cellW-1,cellH-1);for(let k=0;k<4;k++){const gx=x+rand(4,cellW-4),gy=y+rand(4,cellH-4);ctx.strokeStyle='#477c3c28';ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+rand(-2,3),gy-3);ctx.stroke()}}
// striped path hints
ctx.fillStyle='#ffffff08';ctx.fillRect(0,0,W,3);if(mode==='night'){ctx.fillStyle='#17284a77';ctx.fillRect(0,0,W,H);ctx.font=`${Math.min(cellH*.42,38)}px sans-serif`;ctx.fillText('🌙',W*.9,H*.12);for(let i=0;i<18;i++){ctx.fillStyle='#fff4c977';ctx.fillRect((i*97)%W,(i*47)%Math.max(1,H),2,2)}}
for(const m of lawnMowers){ctx.save();ctx.translate(m.x,m.y);rounded(-cellW*.34,-cellH*.17,cellW*.64,cellH*.34,6,'#e8e4c4','#878369');rounded(-cellW*.20,-cellH*.11,cellW*.30,cellH*.21,4,'#c7d27b');ctx.font=`${Math.min(cellH*.3,24)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚜',0,0);ctx.restore()}
for(const s of suns){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.spin);ctx.fillStyle='#ffcb48';for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.ellipse(0,-s.radius*.78,s.radius*.22,s.radius*.42,0,0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.arc(0,0,s.radius*.62,0,Math.PI*2);ctx.fillStyle='#ffe876';ctx.fill();ctx.strokeStyle='#e49c2b';ctx.lineWidth=2;ctx.stroke();ctx.restore();ctx.font=`bold ${Math.max(9,cellH*.12)}px sans-serif`;ctx.textAlign='center';ctx.fillStyle='#fff5cd';ctx.fillText('+25',s.x,s.y+s.radius+10)}
for(const p of plantsOn)drawPlant(p);
for(const nut of rollingNuts){ctx.font=`${Math.min(cellH*.48,38)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🥔',nut.x,nut.y)}
for(const sh of shots){ctx.beginPath();ctx.arc(sh.x,sh.y,Math.max(4,cellH*.085),0,Math.PI*2);ctx.fillStyle=sh.slow?'#b9ecf4':'#81d943';ctx.fill();ctx.strokeStyle='#32663c';ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();ctx.arc(sh.x-2,sh.y-2,2,0,Math.PI*2);ctx.fillStyle='#e6ffad';ctx.fill()}
for(const z of zombies)drawZombie(z);
for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);ctx.font=`${p.size}px sans-serif`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}
if(selected||shovel){const pos=pointer;if(pos){ctx.strokeStyle=shovel?'#ffebac':'#f8f2b5';ctx.lineWidth=3;ctx.strokeRect(pos.c*cellW+3,pos.r*cellH+3,cellW-6,cellH-6)}}
}
function drawPlant(p){const x=boardX(p.c),y=boardY(p.r),s=Math.min(cellW,cellH);ctx.save();ctx.translate(x,y);ctx.fillStyle='#305c3530';ctx.beginPath();ctx.ellipse(0,s*.24,s*.27,s*.09,0,0,Math.PI*2);ctx.fill();
if(p.id==='sun'){ctx.translate(0,Math.sin(p.bob)*2);ctx.fillStyle='#4c9d43';ctx.beginPath();ctx.ellipse(-s*.12,s*.13,s*.16,s*.07,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(s*.13,s*.18,s*.15,s*.07,.45,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6bab42';ctx.beginPath();ctx.roundRect(-s*.045,-s*.01,s*.09,s*.31,s*.04);ctx.fill();for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.ellipse(0,-s*.18,s*.07,s*.13,0,0,Math.PI*2);ctx.fillStyle=i%2?'#ffc837':'#ffdc50';ctx.fill()}ctx.beginPath();ctx.arc(0,0,s*.15,0,Math.PI*2);ctx.fillStyle='#754925';ctx.fill();ctx.fillStyle='#fff2b0';ctx.beginPath();ctx.arc(-s*.045,-s*.035,s*.024,0,7);ctx.arc(s*.045,-s*.035,s*.024,0,7);ctx.fill();ctx.fillStyle='#382a1e';ctx.beginPath();ctx.arc(-s*.04,-s*.03,s*.012,0,7);ctx.arc(s*.05,-s*.03,s*.012,0,7);ctx.fill()}
else if(p.id==='wall'){ctx.fillStyle='#b79865';ctx.beginPath();ctx.ellipse(0,0,s*.25,s*.31,0,0,7);ctx.fill();ctx.strokeStyle='#715b3d';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.08,-s*.06,s*.045,0,7);ctx.arc(s*.08,-s*.06,s*.045,0,7);ctx.fill();ctx.fillStyle='#322b24';ctx.beginPath();ctx.arc(-s*.07,-s*.055,s*.018,0,7);ctx.arc(s*.09,-s*.055,s*.018,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,s*.08,s*.05,0,Math.PI);ctx.stroke()}
else if(p.id==='cherry'){[-.09,.09].forEach((dx,i)=>{ctx.beginPath();ctx.arc(dx*s,-s*.04,s*.12,0,7);ctx.fillStyle=i?'#d94435':'#ee5647';ctx.fill();ctx.strokeStyle='#a62f28';ctx.lineWidth=1;ctx.stroke()});ctx.strokeStyle='#497a37';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-s*.11);ctx.quadraticCurveTo(0,-s*.28,s*.12,-s*.28);ctx.stroke();ctx.fillStyle='#6bab42';ctx.beginPath();ctx.ellipse(s*.1,-s*.24,s*.09,s*.04,-.3,0,7);ctx.fill()}
else if(p.id==='mine'){ctx.fillStyle=p.armed?'#dd5840':'#ad7f4e';ctx.beginPath();ctx.ellipse(0,s*.1,s*.22,s*.15,0,0,7);ctx.fill();ctx.fillStyle='#eee0b9';ctx.beginPath();ctx.arc(-s*.07,s*.08,s*.018,0,7);ctx.arc(s*.07,s*.08,s*.018,0,7);ctx.fill();if(!p.armed){ctx.fillStyle='#518442';ctx.beginPath();ctx.ellipse(0,-s*.04,s*.09,s*.16,-.6,0,7);ctx.fill()}}
else{const isChomp=p.id==='chomp', isSnow=p.id==='snow', isDouble=p.id==='double';ctx.fillStyle=isChomp?'#4a923d':'#62ad4b';ctx.beginPath();ctx.ellipse(-s*.12,s*.17,s*.16,s*.07,-.3,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(s*.1,s*.18,s*.16,s*.06,.3,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(-s*.015,s*.04,s*.18,s*.19,-.12,0,7);ctx.fill();ctx.fillStyle=isSnow?'#bdeaf0':'#a2d65f';ctx.beginPath();ctx.ellipse(s*.12,-s*.05,s*.2,s*.13,0,0,7);ctx.fill();ctx.strokeStyle='#347b46';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.16,-s*.08,s*.045,0,7);ctx.fill();ctx.fillStyle='#27372b';ctx.beginPath();ctx.arc(s*.18,-s*.08,s*.02,0,7);ctx.fill();ctx.fillStyle='#3d6c3e';ctx.beginPath();ctx.ellipse(s*.29,-s*.02,s*.085,s*.045,0,0,7);ctx.fill();if(isDouble){ctx.beginPath();ctx.ellipse(-s*.01,-s*.16,s*.16,s*.11,0,0,7);ctx.fillStyle='#a2d65f';ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.03,-s*.19,s*.035,0,7);ctx.fill();ctx.fillStyle='#27372b';ctx.beginPath();ctx.arc(s*.04,-s*.19,s*.015,0,7);ctx.fill()}if(isChomp){ctx.fillStyle='#f7f0c1';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(s*.1+i*s*.05,s*.05);ctx.lineTo(s*.12+i*s*.05,s*.11);ctx.lineTo(s*.14+i*s*.05,s*.05);ctx.fill()}}}
if(p.maxHp&&p.hp<p.maxHp){rounded(-s*.24,-s*.37,s*.48,4,2,'#30472f');rounded(-s*.24,-s*.37,s*.48*clamp(p.hp/p.maxHp,0,1),4,2,'#d94f3f')}ctx.restore()}
function drawZombie(z){const s=Math.min(cellW,cellH),x=z.x,y=boardY(z.r);ctx.save();ctx.translate(x,y);ctx.fillStyle='#27362442';ctx.beginPath();ctx.ellipse(0,s*.24,s*.28,s*.1,0,0,7);ctx.fill();ctx.fillStyle='#626e53';ctx.beginPath();ctx.ellipse(0,s*.07,s*.2,s*.23,0,0,7);ctx.fill();ctx.fillStyle=z.hitFlash?'#d4e5ac':'#9db18a';ctx.beginPath();ctx.ellipse(0,-s*.12,s*.17,s*.19,0,0,7);ctx.fill();ctx.fillStyle='#e9e7d2';ctx.fillRect(-s*.13,s*.02,s*.26,s*.13);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.055,-s*.14,s*.045,0,7);ctx.arc(s*.06,-s*.14,s*.045,0,7);ctx.fill();ctx.fillStyle='#c94f43';ctx.beginPath();ctx.arc(-s*.05,-s*.14,s*.02,0,7);ctx.arc(s*.065,-s*.14,s*.02,0,7);ctx.fill();ctx.strokeStyle='#64705b';ctx.lineWidth=s*.04;ctx.beginPath();ctx.moveTo(-s*.13,s*.08);ctx.lineTo(-s*.25,s*.02+Math.sin(z.walk)*3);ctx.moveTo(s*.13,s*.08);ctx.lineTo(s*.25,s*.12-Math.sin(z.walk)*3);ctx.stroke();if(z.type.hat){ctx.font=`${s*.24}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(z.type.hat,0,-s*.34)}if(z.slowTimer>0){ctx.strokeStyle='#8de4f0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,s*.26,0,7);ctx.stroke()}ctx.restore();if(z.hp<z.maxHp){rounded(x-s*.22,y-s*.45,s*.44,4,2,'#30472f');rounded(x-s*.22,y-s*.45,s*.44*clamp(z.hp/z.maxHp,0,1),4,2,'#d8503d')}}
let pointer=null;
function addPlant(id,r,c){const spec=plants.find(p=>p.id===id);if(!spec||plantsOn.some(p=>p.r===r&&p.c===c))return false;if(mode==='bowling'&&id==='wall'){if(sun<spec.cost)return false;sun-=spec.cost;rollingNuts.push({x:boardX(c),y:boardY(r),r,speed:cellW*1.35});updateHud();return true}if(sun<spec.cost){showToast('Нужно больше солнышек ☀️');return false}sun-=spec.cost;const p={id,r,c,hp:spec.hp,maxHp:spec.hp,cool:rand(.2,1.1),bob:rand(0,6),armed:false,arm:4.5,bite:0};plantsOn.push(p);if(id==='cherry'){p.fuse=.55;showToast('Бум! Вишня готовится 🍒')}if(id==='mine')showToast('Картошка зарыта — подожди немного');updateHud();return true}
function startGame(which=mode){mode=which;plantsOn=[];zombies=[];shots=[];suns=[];particles=[];rollingNuts=[];sun=which==='night'?100:150;wave=1;score=0;spawned=0;totalZombies=which==='endless'?99:18;spawnTimer=2;lawnMowers=Array.from({length:ROWS},(_,r)=>({x:cellW*.48,y:boardY(r),used:false,active:false}));selected=null;shovel=false;paused=false;gameState='playing';ui.overlay.style.display='none';ui.status.textContent=which==='bowling'?'Выбирай орехи и катай их по дорожкам!':'Расставь растения — не пропусти их!';ui.hint.textContent='☀️ нажми, чтобы собрать';document.getElementById('pauseBtn').textContent='Ⅱ';updateHud();showFlash('ВОЛНА 1 — ОНИ УЖЕ ИДУТ!');}
function showFlash(text){ui.flash.innerHTML=text;ui.flash.classList.add('show');setTimeout(()=>ui.flash.classList.remove('show'),1250)}
function spawnZombie(){const r=Math.floor(rand(0,ROWS)),type=mode==='night'&&Math.random()<.35?zombieTypes[2]:zombieTypes[Math.floor(rand(0,Math.min(zombieTypes.length,2+Math.floor(wave/2))))];const boost=mode==='endless'?1+Math.floor(wave/4)*.2:1;zombies.push({r,x:W+cellW*.25,type,hp:type.hp*boost,maxHp:type.hp*boost,speed:type.speed*(mode==='night'?1.1:1),baseSpeed:type.speed*(mode==='night'?1.1:1),walk:rand(0,7),attack:0,slowTimer:0,hitFlash:false});}
function update(dt){if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)ui.toast.classList.remove('show')}if(gameState!=='playing'||paused)return;
skyTimer-=dt;if(skyTimer<=0){skyTimer=rand(7,11);suns.push({x:rand(cellW,W-cellW*.3),y:-12,radius:Math.min(14,cellH*.14),life:13,spin:0,fromPlant:false})}
for(const p of plantsOn){p.bob+=dt*3;if(p.id==='sun'){p.cool-=dt;if(p.cool<=0){p.cool=p.interval+rand(-.8,1);suns.push({x:boardX(p.c)+rand(-cellW*.2,cellW*.2),y:boardY(p.r)-cellH*.25,radius:Math.min(14,cellH*.14),life:13,spin:0,fromPlant:true})}}if(p.id==='mine'&&!p.armed){p.arm-=dt;if(p.arm<=0)p.armed=true}if(p.id==='cherry'&&p.fuse>0){p.fuse-=dt;if(p.fuse<=0){for(const z of zombies)if(Math.abs(z.x-boardX(p.c))<cellW*1.65&&Math.abs(z.r-p.r)<=1)z.hp-=500;blast(boardX(p.c),boardY(p.r),'💥',12);p.hp=0}}
if(p.id==='pea'||p.id==='snow'||p.id==='double'){p.cool-=dt;if(p.cool<=0&&zombies.some(z=>z.r===p.r&&z.x>boardX(p.c))){p.cool=plants.find(q=>q.id===p.id).interval;const n=p.id==='double'?2:1;for(let i=0;i<n;i++)shots.push({x:boardX(p.c)+cellW*.21,y:boardY(p.r)-cellH*.05-i*4,r:p.r,damage:p.id==='snow'?22:25,slow:p.id==='snow',speed:cellW*1.15})}}
if(p.id==='chomp'){p.bite-=dt;if(p.bite<=0){const target=zombies.find(z=>z.r===p.r&&z.x-boardX(p.c)<cellW*.48&&z.x>boardX(p.c)-cellW*.3);if(target){target.hp=0;p.bite=4.5;blast(target.x,boardY(target.r),'✨',5)}}}
if(p.id==='mine'&&p.armed){const z=zombies.find(z=>z.r===p.r&&Math.abs(z.x-boardX(p.c))<cellW*.38);if(z){z.hp=0;blast(boardX(p.c),boardY(p.r),'💥',7);p.hp=0}}
}
spawnTimer-=dt;if(spawned<totalZombies&&spawnTimer<=0){spawnZombie();spawned++;const base=mode==='endless'?Math.max(1.4,5.3-wave*.3):Math.max(2.2,5.4-wave*.7);spawnTimer=base*rand(.75,1.25);if(spawned%6===0&&mode!=='endless'){wave=Math.min(3,Math.floor(spawned/6)+1);showFlash(`WAVE ${wave} — ПО ТРОПИНКЕ!`);updateHud()}}
for(const nut of rollingNuts){nut.x+=nut.speed*dt;for(const z of zombies)if(z.r===nut.r&&Math.abs(z.x-nut.x)<cellW*.35){z.hp-=180;z.x+=cellW*.12;blast(z.x,boardY(z.r),'💫',3)}if(nut.x>W+cellW)nut.dead=true}rollingNuts=rollingNuts.filter(n=>!n.dead);
for(const sh of shots){sh.x+=sh.speed*dt;const z=zombies.find(z=>z.r===sh.r&&Math.abs(z.x-sh.x)<cellW*.22);if(z){z.hp-=sh.damage;z.hitFlash=true;setTimeout(()=>z.hitFlash=false,70);if(sh.slow){z.slowTimer=2.2}sh.dead=true;particles.push({x:sh.x,y:sh.y,life:.3,size:14,text:'✦'})}}
shots=shots.filter(s=>!s.dead&&s.x<W+20);
for(const z of zombies){z.walk+=dt*7;if(z.slowTimer>0)z.slowTimer-=dt;else z.speed=z.baseSpeed;const target=plantsOn.find(p=>p.r===z.r&&Math.abs(z.x-(boardX(p.c)+cellW*.2))<cellW*.36&&p.hp>0);if(target){z.attack-=dt;if(z.attack<=0){target.hp-=22;z.attack=.7;particles.push({x:boardX(target.c),y:boardY(target.r)-cellH*.23,life:.35,size:13,text:'💢'})}}else z.x-=z.speed*(z.slowTimer>0?.55:1)*dt;
const mower=lawnMowers[z.r];if(z.x<cellW*.55&&mower&&!mower.used){mower.used=true;mower.active=true}if(z.x<-cellW*.3){gameState='lost';showEnd(false);return}}
for(const m of lawnMowers){if(m.active){m.x+=cellW*2.7*dt;for(const z of zombies)if(z.r===lawnMowers.indexOf(m)&&z.x<m.x+cellW*.5)z.hp=0;if(m.x>W+cellW)m.active=false}}
zombies=zombies.filter(z=>{if(z.hp<=0){sun+=z.type.reward;score++;particles.push({x:z.x,y:boardY(z.r)-cellH*.3,life:.9,size:17,text:'☀️'});return false}return true});
plantsOn=plantsOn.filter(p=>p.hp>0);
for(const s of suns){s.life-=dt;s.spin+=dt*.7;if(s.fromPlant)s.y+=Math.sin(s.spin*2)*dt*2;else s.y+=dt*3}suns=suns.filter(s=>s.life>0);
for(const p of particles){p.y-=dt*22;p.life-=dt}particles=particles.filter(p=>p.life>0);
if(mode!=='endless'&&spawned>=totalZombies&&zombies.length===0){gameState='won';showEnd(true)}updateHud();}
function blast(x,y,text,n){for(let i=0;i<n;i++)particles.push({x:x+rand(-cellW*.45,cellW*.45),y:y+rand(-cellH*.25,cellH*.25),life:rand(.5,1.2),size:rand(16,28),text})}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);drawBoard();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function beep(freq=440,duration=.08){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.035,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);o.start();o.stop(a.currentTime+duration)}catch{}}
function menuMarkup(){return `<div class="modal"><div class="hero">🌻 🧟‍♂️ 🌱</div><div class="eyebrow">Соседский дозор · сад 01</div><h1>Зомби уже<br>за забором!</h1><p>Собирай солнышки, сажай защитников и не дай нежити добраться до дома. Все дорожки на виду — играй одним пальцем.</p><div class="mode-grid"><button class="mode-choice active" data-mode="garden">🌼 Двор</button><button class="mode-choice" data-mode="night">🌙 Ночь</button><button class="mode-choice" data-mode="bowling">🥔 Орехобол</button><button class="mode-choice" data-mode="endless">♾️ Выживание</button></div><button class="modal-btn" id="startBtn">НАЧАТЬ ЗАЩИТУ →</button></div>`}
function showMenu(){gameState='menu';paused=false;ui.overlay.innerHTML=menuMarkup();ui.overlay.style.display='grid';ui.overlay.querySelectorAll('.mode-choice').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;ui.overlay.querySelectorAll('.mode-choice').forEach(q=>q.classList.toggle('active',q===b))});document.getElementById('startBtn').onclick=()=>startGame(mode)}
function showEnd(win){ui.overlay.innerHTML=`<div class="modal"><div class="hero">${win?'🏡🌻✨':'🧟‍♂️💥🏚️'}</div><div class="eyebrow">${win?'двор спасён':'зомби прорвались'}</div><h1>${win?'УРА! Победа!':'Ой-ой…'}</h1><p>${win?'Все дорожки очищены! Ты настоящий защитник сада.':'Зомби добрались до дома. Попробуй больше подсолнухов и орехов.'}<br>Побеждено зомби: <b>${score}</b></p><button class="modal-btn" id="againBtn">${win?'ЕЩЁ РАЗ':'ПОПРОБОВАТЬ СНОВА'} ↻</button><button class="mode-choice" id="menuBtn" style="margin-left:8px">В меню</button></div>`;ui.overlay.style.display='grid';document.getElementById('againBtn').onclick=()=>startGame(mode);document.getElementById('menuBtn').onclick=showMenu}
function showPause(){paused=true;ui.overlay.innerHTML=`<div class="modal"><div class="hero">⏸️</div><div class="eyebrow">время перевести дух</div><h1>Пауза</h1><p>Твой сад подождёт. Вернись к защите, когда будешь готов.</p><button class="modal-btn" id="resumeBtn">ПРОДОЛЖИТЬ ▶</button> <button class="mode-choice" id="pauseMenu">В меню</button></div>`;ui.overlay.style.display='grid';document.getElementById('resumeBtn').onclick=()=>{paused=false;ui.overlay.style.display='none'};document.getElementById('pauseMenu').onclick=showMenu}
function showHelp(){helpReturn=gameState;const wasPaused=paused;paused=true;ui.overlay.innerHTML=`<div class="modal"><div class="hero">🌱☀️🧟</div><div class="eyebrow">памятка садовода</div><h1>Как играть</h1><p>☀️ Тапни по солнышку, чтобы собрать его.<br>🌱 Выбери карточку, затем коснись клетки газона.<br>🪏 Лопатой можно убрать растение и вернуть часть цены.<br>🚜 Газонокосилка — последняя защита дорожки.<br><br><b>Орехобол:</b> выбирай орех и запускай его по дорожке!</p><button class="modal-btn" id="gotIt">ПОНЯТНО</button></div>`;ui.overlay.style.display='grid';document.getElementById('gotIt').onclick=()=>{if(helpReturn==='menu'){showMenu();return}if(wasPaused){showPause();return}ui.overlay.style.display='none';paused=false}}

canvas.addEventListener('pointermove',e=>{const b=canvas.getBoundingClientRect();const c=Math.floor((e.clientX-b.left)/cellW),r=Math.floor((e.clientY-b.top)/cellH);pointer=c>=0&&c<COLS&&r>=0&&r<ROWS?{c,r}:null});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const b=canvas.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;for(let i=suns.length-1;i>=0;i--){const s=suns[i];if(Math.hypot(s.x-x,s.y-y)<Math.max(24,s.radius+12)){sun+=25;suns.splice(i,1);updateHud();if(sound)beep(680,.07);return}}if(gameState!=='playing'||paused)return;const c=Math.floor(x/cellW),r=Math.floor(y/cellH);if(c<0||c>=COLS||r<0||r>=ROWS)return;if(shovel){const p=plantsOn.find(p=>p.c===c&&p.r===r);if(p){plantsOn=plantsOn.filter(q=>q!==p);sun+=Math.floor(plants.find(q=>q.id===p.id).cost*.4);showToast('Растение убрано');updateHud()}shovel=false;updateHud();return}if(!selected){showToast('Выбери растение на карточке');return}if(mode!=='bowling'&&plantsOn.some(p=>p.c===c&&p.r===r)){showToast('Здесь уже кто-то растёт!');return}if(mode==='bowling'&&selected!=='wall'){showToast('В Орехоболе выбирай карточку ореха 🥔');return}addPlant(selected,r,c);selected=null;updateHud();if(sound)beep(390,.05)});
document.getElementById('pauseBtn').onclick=()=>{if(gameState==='playing'){if(paused){paused=false;ui.overlay.style.display='none'}else showPause()}};
document.getElementById('shovelBtn').onclick=()=>{if(gameState!=='playing'||paused)return;shovel=!shovel;selected=null;updateHud();showToast(shovel?'Тапни по растению, чтобы убрать 🪏':'Лопата убрана')};
document.getElementById('helpBtn').onclick=showHelp;
document.getElementById('soundBtn').onclick=()=>{sound=!sound;document.getElementById('soundBtn').innerHTML=`${sound?'🔊':'🔇'} <span>${sound?'Звук':'Тихо'}</span>`;if(sound)beep(520,.08)};
showMenu();
})();
</script>
</body>
